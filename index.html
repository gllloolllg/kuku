<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f1e3f0" />
  <link rel="apple-touch-icon" sizes="120x120" href="image/icon-120x120.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image/icon-180x180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <title>九九</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <h1 id="app-title" aria-live="polite">九九アプリ</h1>

  <main id="app" class="container" tabindex="-1" aria-live="polite"></main>

  <!-- 合格モーダル -->
  <div id="modal-backdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">合格処理</h2>
      <form id="pass-form">
        <input id="pass-input" class="input" type="text" inputmode="kana" autocomplete="off" placeholder="キーワード" aria-required="true" />
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="modal-cancel">キャンセル</button>
          <button type="submit" class="btn primary" id="pass-submit" disabled>送信</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
